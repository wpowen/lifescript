        INFOPLIST_KEY_CFBundleDisplayName: "天机录"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTianjilu
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColorTianjilu
